# SE7O-SNA Panel v3.0.0
# Copy the values below into your platform's environment variables & start command.

start_command = "python main.py"

[env]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "your-strong-password"
SECRET_KEY = "generate-a-random-string"
DB_PATH = "/data/panel.db"
DOMAIN = "your-app-domain.example.com"
PORT = "8080"

# Telegram MTProto proxy. The FakeTLS secret is generated on first run and
# persisted; you do not need to set it. After deploying, create a TCP Proxy in
# your platform and point it at the internal port below (443).
MTPROXY_ENABLED = "true"
MTPROXY_PORT = "443"
MTPROXY_FAKE_DOMAIN = "www.cloudflare.com"

# Optional: use external PostgreSQL instead of SQLite.
# DATABASE_URL = "postgresql://user:***@host:5432/dbname"

# ---------------------------------------------------------------------------
# Aether tunnel (merged from ASiRi-web-panel) -- optional exit for ALL users
# ---------------------------------------------------------------------------
# The tunnel itself is managed from the panel's "Aether" tab (start/stop,
# protocol, scan mode, watchdog). These variables are optional:
#
# Where users' traffic leaves the server:
#   direct (default) | auto (Aether while connected, else direct) |
#   aether (always via Aether; connections are REFUSED while it is down)
# When set, this overrides the choice saved in the panel.
# AETHER_OUTBOUND = "direct"
# Start the tunnel automatically after every restart (needs the binary).
# AETHER_AUTO_START = "1"
# Binary location (the Dockerfile installs it at /usr/local/bin/aether) and
# the pinned release used by the in-panel "Install" button.
# AETHER_BIN = "/usr/local/bin/aether"
# AETHER_VERSION = "v1.5.0"
# Watchdog tuning (seconds unless noted); defaults shown.
# WATCHDOG_INTERVAL_SEC = "30"
# WATCHDOG_MAX_FAILURES = "3"
# WATCHDOG_STUCK_SEC = "300"
# WATCHDOG_BACKOFF_BASE_SEC = "2"
# WATCHDOG_BACKOFF_MAX_SEC = "300"
